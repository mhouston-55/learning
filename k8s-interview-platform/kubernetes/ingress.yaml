apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interview-platform-ingress
  namespace: k8s-interview-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Optional: if using cert-manager
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - interview.yourdomain.com
    secretName: interview-tls
  rules:
  - host: interview.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: interview-frontend
            port:
              number: 80
