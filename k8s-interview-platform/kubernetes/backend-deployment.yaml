apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-backend
  namespace: k8s-interview-platform
  labels:
    app: interview-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interview-backend
  template:
    metadata:
      labels:
        app: interview-backend
    spec:
      serviceAccountName: interview-backend-sa
      containers:
      - name: backend
        image: your-registry/k8s-interview-backend:latest
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/scenarios
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/scenarios
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: interview-backend
  namespace: k8s-interview-platform
spec:
  selector:
    app: interview-backend
  ports:
  - port: 3001
    targetPort: 3001
    name: http
  type: ClusterIP
