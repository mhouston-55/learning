apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-frontend
  namespace: k8s-interview-platform
  labels:
    app: interview-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interview-frontend
  template:
    metadata:
      labels:
        app: interview-frontend
    spec:
      containers:
      - name: frontend
        image: your-registry/k8s-interview-frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: interview-frontend
  namespace: k8s-interview-platform
spec:
  selector:
    app: interview-frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
