apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        env:
        - name: API_URL
          value: "http://api-gateway-wrong:8080"  # Intentional error: wrong service name
        resources:
          requests:
            memory: "32Mi"  # Too low
            cpu: "50m"
          limits:
            memory: "64Mi"  # Too low, will cause OOMKill
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9999  # Intentional error: wrong port
          initialDelaySeconds: 3
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
