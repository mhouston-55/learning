replicaCount: 3

image:
  repository: nginx
  tag: "invalid-version"  # Intentional error
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

env:
  - name: APP_MODE
    value: "production"
  - name: DATABASE_URL
    value: "postgresql://wronghost:5432/db"  # Intentional error
