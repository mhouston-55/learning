input {
  file {
    path => "/zeek-logs/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    tags => ["zeek"]
  }
}

filter {
  if "zeek" in [tags] {
    # Parse Zeek JSON logs
    json {
      source => "message"
    }

    # Add MITRE ATT&CK mapping based on Zeek events
    if [id.orig_h] {
      mutate {
        add_field => { "source_ip" => "%{[id.orig_h]}" }
        add_field => { "dest_ip" => "%{[id.resp_h]}" }
        add_field => { "source_port" => "%{[id.orig_p]}" }
        add_field => { "dest_port" => "%{[id.resp_p]}" }
      }
    }

    # Detect potential C2 beaconing (regular intervals)
    if [service] == "http" and [method] == "POST" {
      mutate {
        add_field => { "threat_indicator" => "potential_c2_beacon" }
        add_field => { "mitre_technique" => "T1071.001 - Web Protocols" }
      }
    }

    # Detect DNS tunneling (long DNS queries)
    if [query] and [qtype_name] == "TXT" {
      ruby {
        code => '
          query_length = event.get("query").to_s.length
          if query_length > 50
            event.set("threat_indicator", "potential_dns_tunneling")
            event.set("mitre_technique", "T1071.004 - DNS")
          end
        '
      }
    }

    # Detect SMB lateral movement
    if [service] == "smb" or [service] == "dce_rpc" {
      mutate {
        add_field => { "threat_indicator" => "potential_lateral_movement" }
        add_field => { "mitre_technique" => "T1021.002 - SMB/Windows Admin Shares" }
      }
    }
  }
}

output {
  if "zeek" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "zeek-logs-%{+YYYY.MM.dd}"
    }
  }
}
