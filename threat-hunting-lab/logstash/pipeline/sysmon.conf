input {
  file {
    path => "/sysmon-logs/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    tags => ["sysmon"]
  }
}

filter {
  if "sysmon" in [tags] {
    json {
      source => "message"
    }

    # Map Sysmon Event IDs to MITRE ATT&CK
    if [EventID] == 1 {
      mutate {
        add_field => { "event_type" => "Process Creation" }
      }

      # Detect suspicious processes
      if [Image] =~ /(?i)powershell|cmd|wmic|psexec|mimikatz/ {
        mutate {
          add_field => { "threat_indicator" => "suspicious_process" }
        }
      }

      # Detect encoded commands
      if [CommandLine] =~ /(?i)-enc|-encodedcommand|frombase64/ {
        mutate {
          add_field => { "threat_indicator" => "encoded_command" }
          add_field => { "mitre_technique" => "T1027 - Obfuscated Files or Information" }
        }
      }
    }

    if [EventID] == 3 {
      mutate {
        add_field => { "event_type" => "Network Connection" }
      }

      # Detect suspicious network connections
      if [DestinationPort] in ["4444", "5555", "8443", "31337"] {
        mutate {
          add_field => { "threat_indicator" => "suspicious_port" }
          add_field => { "mitre_technique" => "T1071 - Application Layer Protocol" }
        }
      }
    }

    if [EventID] == 10 {
      mutate {
        add_field => { "event_type" => "Process Access" }
      }

      # Detect credential dumping (lsass access)
      if [TargetImage] =~ /(?i)lsass\.exe/ {
        mutate {
          add_field => { "threat_indicator" => "credential_dumping" }
          add_field => { "mitre_technique" => "T1003.001 - LSASS Memory" }
        }
      }
    }

    if [EventID] == 11 {
      mutate {
        add_field => { "event_type" => "File Creation" }
      }

      # Detect suspicious file writes
      if [TargetFilename] =~ /(?i)\.exe$|\.dll$|\.ps1$/ and [TargetFilename] =~ /(?i)temp|appdata|programdata/ {
        mutate {
          add_field => { "threat_indicator" => "suspicious_file_write" }
        }
      }
    }

    if [EventID] == 22 {
      mutate {
        add_field => { "event_type" => "DNS Query" }
      }

      # Detect suspicious domains
      if [QueryName] =~ /(?i)\.tk$|\.ml$|pastebin|ngrok|dyndns/ {
        mutate {
          add_field => { "threat_indicator" => "suspicious_domain" }
          add_field => { "mitre_technique" => "T1071.001 - Web Protocols" }
        }
      }
    }
  }
}

output {
  if "sysmon" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "sysmon-logs-%{+YYYY.MM.dd}"
    }
  }
}
